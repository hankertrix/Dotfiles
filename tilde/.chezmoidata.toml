# Additional data for chezmoi
rootConfigFolder = "slash"

# Maple Mono is the standard Maple Mono with double width icons
terminalFont = "Maple Mono NF CN"
terminalFontSize = 12

# Maple Mono NFM is Maple Mono with single width icons (Nerd Fonts Mono)
monoFont = "Maple Mono NFM CN"

# Maple Mono NFP is Maple Mono with variable width icons (Nerd Fonts Propo)
guiFont = "Maple Mono NFP CN"

# The icon theme used
iconTheme = "kora"

# The cursor theme used
cursorTheme = "Hacked-Sky-Cursor"
cursorSize = 24

# The default terminal
defaultTerminal = "kitty"

# The window corner radius for Niri
windowCornerRadius = 8

# The latitude and longitude of my location
latitude = 55.39594
longitude = 10.38831
